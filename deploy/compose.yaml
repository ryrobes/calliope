      CALLIOPE_MODEL_CONTEXT_LENGTH: ${CALLIOPE_MODEL_CONTEXT_LENGTH:-262144}
      CALLIOPE_MODEL_MAX_TOKENS: ${CALLIOPE_MODEL_MAX_TOKENS:-32768}
      HERMES_ENVIRONMENT_HINT: Calliope is the appliance UI. Company data is local in RVBBIT Postgres; remote source
        credentials are used only by the dlt mirror controller. Dashboard scratch files and the Warehouse source_path
        handoff both use /opt/data; a local HTML path is never the finished deliverable. Save user-facing files
        under /opt/data/outputs for automatic Stage publication; keep tests and working files outside outputs/exports.
        Markdown file links and MEDIA attachments in your reply also publish files.
      HERMES_GID: ${HERMES_GID:-10000}
