      HINDSIGHT_API_URL: http://hindsight:8888
      HINDSIGHT_MODE: local_external
      HINDSIGHT_TIMEOUT: ${HINDSIGHT_TIMEOUT:-120}
      # shared: one memory per agent across every conversation; audience: recall only
      # what everyone in the conversation could see (memories always carry the tags).
      CALLIOPE_MEMORY_SCOPE: ${CALLIOPE_MEMORY_SCOPE:-shared}
      RVBBIT_CLOVER_KEY: ${RVBBIT_CLOVER_KEY:?Provision RVBBIT_CLOVER_KEY using ./configure.py}
      RVBBIT_CLOVER_OPENAI_BASE_URL: ${RVBBIT_CLOVER_OPENAI_BASE_URL:-http://clover:8090/v1}
      WAREHOUSE_HERMES_MCP_KEY: ${WAREHOUSE_HERMES_MCP_KEY:?Provision WAREHOUSE_HERMES_MCP_KEY using ./configure.py}
      CALLIOPE_OPENROUTER_KEY_FILE: /run/clover-credentials/openrouter.key
      CALLIOPE_UI_STUDIO_CONFIG: /run/secrets/studio-client.json
    expose:
    - '8642'
    - '8643'
    healthcheck:
      interval: 5s
      retries: 60
      start_period: 20s
      test:
      - CMD-SHELL
      - 'curl -fsS -H "Authorization: Bearer $${API_SERVER_KEY}" http://127.0.0.1:8642/health >/dev/null && curl
        -fsS http://127.0.0.1:9222/json/version >/dev/null'
      timeout: 5s
