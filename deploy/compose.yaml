        required: true
    environment:
      API_SERVER_ENABLED: 'true'
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_KEY: ${WAREHOUSE_HERMES_API_KEY:?Provision WAREHOUSE_HERMES_API_KEY using ./configure.py}
      API_SERVER_PORT: '8642'
      BU_CDP_URL: http://127.0.0.1:9222
