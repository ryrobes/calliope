      HINDSIGHT_API_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Provision POSTGRES_PASSWORD using ./configure.py}@postgres:5432/${POSTGRES_DB:-rvbbit}
      HINDSIGHT_API_EMBEDDINGS_OPENAI_API_KEY: ${RVBBIT_CLOVER_KEY:?Provision RVBBIT_CLOVER_KEY using ./configure.py}
      HINDSIGHT_API_EMBEDDINGS_OPENAI_BASE_URL: ${RVBBIT_CLOVER_OPENAI_BASE_URL:-http://clover:8090/v1}
      HINDSIGHT_API_EMBEDDINGS_OPENAI_MODEL: embed
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: openai
      HINDSIGHT_API_HOST: 0.0.0.0
      HINDSIGHT_API_LLM_API_KEY: ${RVBBIT_CLOVER_KEY:?Provision RVBBIT_CLOVER_KEY using ./configure.py}
      HINDSIGHT_API_LLM_BASE_URL: ${RVBBIT_CLOVER_OPENAI_BASE_URL:-http://clover:8090/v1}
      # Memory extraction and consolidation run after every turn; the small model
      # does them well at about a tenth of the flagship chat model's cost.
      HINDSIGHT_API_LLM_MODEL: ${RVBBIT_HINDSIGHT_LLM_MODEL:-calliope-luna}
      # Without a fixed language the small model wrote some memories in French or
      # Spanish from English conversations. Set another language for non-English teams.
      HINDSIGHT_API_LLM_OUTPUT_LANGUAGE: ${RVBBIT_HINDSIGHT_OUTPUT_LANGUAGE:-English}
      HINDSIGHT_API_LLM_PROVIDER: openai
      HINDSIGHT_API_LLM_TRACE_ENABLED: 'true'
      HINDSIGHT_API_LLM_TRACE_MAX_CHARS: '1'
      HINDSIGHT_API_LLM_TRACE_RETENTION_DAYS: '7'
      HINDSIGHT_API_PORT: '8888'
      HINDSIGHT_API_RERANKER_PROVIDER: openrouter
      HINDSIGHT_API_WORKER_ID: calliope-hindsight
      HINDSIGHT_API_RERANKER_OPENROUTER_MODEL: rerank
      HINDSIGHT_API_RERANKER_OPENROUTER_BASE_URL: http://clover:8090/v1/rerank
      HINDSIGHT_API_RERANKER_OPENROUTER_API_KEY: ${RVBBIT_CLOVER_KEY}
      # If reranking still fails after Clover's retries, recall keeps its fusion
