# Canonical shipping stack. Build definitions live in release/services.json.
name: ${COMPOSE_PROJECT_NAME:-calliope}
networks:
  default:
    name: ${COMPOSE_PROJECT_NAME:-calliope}
services:
  bootstrap:
    command:
    - rvbbit-uber-bootstrap
    depends_on:
      postgres:
        condition: service_healthy
        required: true
      warren:
        condition: service_started
        required: true
      clover:
        condition: service_healthy
    environment:
      RVBBIT_CLOVER_INSTALL_SOURCE: shipped
      RVBBIT_CLOVER_KEY: ${RVBBIT_CLOVER_KEY:?Provision RVBBIT_CLOVER_KEY using ./configure.py}
      RVBBIT_CLOVER_OPENAI_BASE_URL: ${RVBBIT_CLOVER_OPENAI_BASE_URL:-http://clover:8090/v1}
      RVBBIT_CLOVER_REQUIRED: 'true'
      RVBBIT_CLOVER_REQUIRED_MODEL: ${RVBBIT_CLOVER_REQUIRED_MODEL:-calliope}
      RVBBIT_CLOVER_VERIFY_REMOTE: 'false'
      RVBBIT_DSN: postgresql://postgres:${POSTGRES_PASSWORD:?Provision POSTGRES_PASSWORD using ./configure.py}@postgres:5432/${POSTGRES_DB:-rvbbit}
      RVBBIT_HINDSIGHT_ENDPOINT: http://hindsight:8888
      RVBBIT_HOSTED_SERVICES: 'true'
      RVBBIT_LENS_BOOTSTRAP_CONNECTION: ${RVBBIT_LENS_BOOTSTRAP_CONNECTION:-true}
      RVBBIT_LENS_CONNECTIONS_PATH: /var/lib/rvbbit/lens/connections.json
      RVBBIT_LENS_CONNECTION_DATABASE: ${POSTGRES_DB:-rvbbit}
      RVBBIT_LENS_CONNECTION_HOST: ${RVBBIT_LENS_CONNECTION_HOST:-postgres}
      RVBBIT_LENS_CONNECTION_ID: ${RVBBIT_LENS_CONNECTION_ID:-rvbbit-uber}
      RVBBIT_LENS_CONNECTION_LABEL: ${RVBBIT_LENS_CONNECTION_LABEL:-Calliope}
      RVBBIT_LENS_CONNECTION_PASSWORD: ${POSTGRES_PASSWORD:?Provision POSTGRES_PASSWORD using ./configure.py}
      RVBBIT_LENS_CONNECTION_PORT: ${RVBBIT_LENS_CONNECTION_PORT:-5432}
      RVBBIT_LENS_CONNECTION_USER: ${RVBBIT_LENS_CONNECTION_USER:-postgres}
      RVBBIT_UBER_BOOTSTRAP_CAPABILITIES: ${RVBBIT_UBER_BOOTSTRAP_CAPABILITIES:-runtimes/python-runtime,runtimes/mcp-gateway,data/dlt-mirror}
      RVBBIT_UBER_BOOTSTRAP_POLL_SECONDS: ${RVBBIT_UBER_BOOTSTRAP_POLL_SECONDS:-2}
      RVBBIT_UBER_BOOTSTRAP_TIMEOUT_SECONDS: ${RVBBIT_UBER_BOOTSTRAP_TIMEOUT_SECONDS:-600}
      RVBBIT_UBER_SKIP_BOOTSTRAP: ${RVBBIT_UBER_SKIP_BOOTSTRAP:-false}
      RVBBIT_UBER_TARGET_SELECTOR: ${RVBBIT_UBER_TARGET_SELECTOR:-}
      WARREN_NODE: ${WARREN_NODE:-compose-warren}
      RVBBIT_CLOVER_BASE_URL: http://clover:8090
      RVBBIT_CLOVER_CATALOG_SQL: /etc/clover/catalog.sql
      RVBBIT_RELEASE_CATALOG_SQL: /etc/calliope/capabilities.sql
    image: ${CALLIOPE_REGISTRY:-ghcr.io/ryrobes}/calliope-postgres:${CALLIOPE_VERSION:-1.2.1}
    networks:
      default: null
    restart: 'no'
    volumes:
    - source: rvbbit_lens
      target: /var/lib/rvbbit/lens
      type: volume
      volume: {}
    - type: bind
      source: ./state/clover/catalog.sql
      target: /etc/clover/catalog.sql
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./config/inference.sql
      target: /etc/clover/inference.sql
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./config/capabilities.sql
      target: /etc/calliope/capabilities.sql
      read_only: true
      bind:
        create_host_path: false
  calliope:
    depends_on:
      bootstrap:
        condition: service_completed_successfully
        required: true
      postgres:
        condition: service_healthy
        required: true
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CALLIOPE_MEDIA_LEDGER_DIR: /app/data/media-ledger
      ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
      ELEVENLABS_VOICE_ID: ${ELEVENLABS_VOICE_ID:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GMEET_CONNECTOR_TOKEN: ${GMEET_CONNECTOR_TOKEN:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_QUOTA_PROJECT: ${GOOGLE_CLOUD_QUOTA_PROJECT:-}
      LENS_PUBLIC_URL: ${LENS_PUBLIC_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RVBBIT_CLOVER_KEY: ${RVBBIT_CLOVER_KEY:?Provision RVBBIT_CLOVER_KEY using ./configure.py}
      RVBBIT_CLOVER_OPENAI_BASE_URL: ${RVBBIT_CLOVER_OPENAI_BASE_URL:-http://clover:8090/v1}
      RVBBIT_CLOVER_REQUIRED_MODEL: ${RVBBIT_CLOVER_REQUIRED_MODEL:-calliope}
      RVBBIT_GATEWAY_TOKEN: ${RVBBIT_GATEWAY_TOKEN:?Provision RVBBIT_GATEWAY_TOKEN using ./configure.py}
      RVBBIT_MIRROR_TOKEN: ${RVBBIT_MIRROR_TOKEN:?Provision RVBBIT_MIRROR_TOKEN using ./configure.py}
      WAREHOUSE_ALLOWED_EMAILS: ${WAREHOUSE_ALLOWED_EMAILS:?Provision one bootstrap administrator email using ./configure.py}
      WAREHOUSE_AUTH: ${WAREHOUSE_AUTH:-shared}
      CALLIOPE_DEMO_MODE: ${CALLIOPE_DEMO_MODE:-0}
      CALLIOPE_DEMO_SCHEMAS: ${CALLIOPE_DEMO_SCHEMAS:-public_demo}
      CALLIOPE_DEMO_ROW_LIMIT: ${CALLIOPE_DEMO_ROW_LIMIT:-500}
      CALLIOPE_DEMO_QUERY_TIMEOUT_MS: ${CALLIOPE_DEMO_QUERY_TIMEOUT_MS:-5000}
      WAREHOUSE_BRAIN_IMPORT_ROOTS: ${WAREHOUSE_BRAIN_IMPORT_ROOTS:-/opt/data/workspace:/opt/data/outputs:/app/data/brain-imports}
      WAREHOUSE_BUSINESS_TOPOLOGY_ASSEMBLY_BACKEND: ${WAREHOUSE_BUSINESS_TOPOLOGY_ASSEMBLY_BACKEND:-}
      WAREHOUSE_BUSINESS_TOPOLOGY_ASSEMBLY_MODEL: ${WAREHOUSE_BUSINESS_TOPOLOGY_ASSEMBLY_MODEL:-}
      WAREHOUSE_BUSINESS_TOPOLOGY_DIR: /app/data/business-topology
      WAREHOUSE_BUSINESS_TOPOLOGY_DSN: ${WAREHOUSE_BUSINESS_TOPOLOGY_DSN:-}
      WAREHOUSE_BUSINESS_TOPOLOGY_GLOBAL_OVERLAP_POPULATIONS: ${WAREHOUSE_BUSINESS_TOPOLOGY_GLOBAL_OVERLAP_POPULATIONS:-512}
      WAREHOUSE_BUSINESS_TOPOLOGY_GLOBAL_OVERLAP_TIMEOUT_MS: ${WAREHOUSE_BUSINESS_TOPOLOGY_GLOBAL_OVERLAP_TIMEOUT_MS:-120000}
      WAREHOUSE_BUSINESS_TOPOLOGY_JUDGMENT_BACKEND: ${WAREHOUSE_BUSINESS_TOPOLOGY_JUDGMENT_BACKEND:-}
      WAREHOUSE_BUSINESS_TOPOLOGY_JUDGMENT_MODEL: ${WAREHOUSE_BUSINESS_TOPOLOGY_JUDGMENT_MODEL:-}
      WAREHOUSE_BUSINESS_TOPOLOGY_LEASE_SECONDS: ${WAREHOUSE_BUSINESS_TOPOLOGY_LEASE_SECONDS:-300}
      WAREHOUSE_BUSINESS_TOPOLOGY_OVERLAP_PROBE_BATCH_SIZE: ${WAREHOUSE_BUSINESS_TOPOLOGY_OVERLAP_PROBE_BATCH_SIZE:-100}
      WAREHOUSE_BUSINESS_TOPOLOGY_OVERLAP_PROBE_PAIRS: ${WAREHOUSE_BUSINESS_TOPOLOGY_OVERLAP_PROBE_PAIRS:-1000}
      WAREHOUSE_BUSINESS_TOPOLOGY_POLL_SECONDS: ${WAREHOUSE_BUSINESS_TOPOLOGY_POLL_SECONDS:-2}
      WAREHOUSE_BUSINESS_TOPOLOGY_TARGETED_OVERLAP_TIMEOUT_MS: ${WAREHOUSE_BUSINESS_TOPOLOGY_TARGETED_OVERLAP_TIMEOUT_MS:-30000}
      WAREHOUSE_BUSINESS_TOPOLOGY_WORKER: ${WAREHOUSE_BUSINESS_TOPOLOGY_WORKER:-1}
      WAREHOUSE_CALLIOPE_DIR: /app/data/calliope
      WAREHOUSE_CALLIOPE_EXPORT_ROOTS: /opt/data
      WAREHOUSE_CALLIOPE_MAX_AUDIO_BYTES: ${WAREHOUSE_CALLIOPE_MAX_AUDIO_BYTES:-12582912}
      WAREHOUSE_CALLIOPE_MAX_AUDIO_SECONDS: ${WAREHOUSE_CALLIOPE_MAX_AUDIO_SECONDS:-600}
      WAREHOUSE_CALLIOPE_MAX_EXPORT_BYTES: ${WAREHOUSE_CALLIOPE_MAX_EXPORT_BYTES:-134217728}
      WAREHOUSE_CALLIOPE_STT_KEYWORDS: ${WAREHOUSE_CALLIOPE_STT_KEYWORDS:-}
      WAREHOUSE_CALLIOPE_STT_LANGUAGES: ${WAREHOUSE_CALLIOPE_STT_LANGUAGES:-}
      WAREHOUSE_CALLIOPE_STYLE_ALLOW_PRIVATE_URLS: ${WAREHOUSE_CALLIOPE_STYLE_ALLOW_PRIVATE_URLS:-false}
      WAREHOUSE_CALLIOPE_TTS_EXPRESSIVE_MODEL: ${WAREHOUSE_CALLIOPE_TTS_EXPRESSIVE_MODEL:-eleven_v3}
      WAREHOUSE_CALLIOPE_TTS_EXPRESSIVE_STABILITY: ${WAREHOUSE_CALLIOPE_TTS_EXPRESSIVE_STABILITY:-0.3}
      WAREHOUSE_CALLIOPE_TTS_FAST_MODEL: ${WAREHOUSE_CALLIOPE_TTS_FAST_MODEL:-eleven_flash_v2_5}
      WAREHOUSE_CALLIOPE_TTS_PREPARE_TIMEOUT_SECONDS: ${WAREHOUSE_CALLIOPE_TTS_PREPARE_TIMEOUT_SECONDS:-120}
      WAREHOUSE_CALLIOPE_TTS_SAMPLE_RATE: ${WAREHOUSE_CALLIOPE_TTS_SAMPLE_RATE:-24000}
      WAREHOUSE_DLT_MIRROR_URL: ${WAREHOUSE_DLT_MIRROR_URL:-}
      WAREHOUSE_DSN: postgresql://postgres:${POSTGRES_PASSWORD:?Provision POSTGRES_PASSWORD using ./configure.py}@postgres:5432/${POSTGRES_DB:-rvbbit}
      WAREHOUSE_FILE_IMPORT_ROOTS: ${WAREHOUSE_FILE_IMPORT_ROOTS:-/opt/data/workspace:/opt/data/outputs:/app/data/brain-imports}
      WAREHOUSE_GOOGLE_CLIENT_ID: ${WAREHOUSE_GOOGLE_CLIENT_ID:-}
      WAREHOUSE_GOOGLE_CLIENT_SECRET: ${WAREHOUSE_GOOGLE_CLIENT_SECRET:-}
      WAREHOUSE_GOOGLE_HD: ${WAREHOUSE_GOOGLE_HD:-}
      WAREHOUSE_GOOGLE_ONLY: ${WAREHOUSE_GOOGLE_ONLY:-}
      WAREHOUSE_GOOGLE_PICKER_API_KEY: ${WAREHOUSE_GOOGLE_PICKER_API_KEY:-}
      WAREHOUSE_GOOGLE_PICKER_APP_ID: ${WAREHOUSE_GOOGLE_PICKER_APP_ID:-}
      WAREHOUSE_HERMES_API_KEY: ${WAREHOUSE_HERMES_API_KEY:?Provision WAREHOUSE_HERMES_API_KEY using ./configure.py}
      WAREHOUSE_HERMES_MCP_CALLER: ${WAREHOUSE_HERMES_MCP_CALLER:-}
      WAREHOUSE_HERMES_MCP_KEY: ${WAREHOUSE_HERMES_MCP_KEY:?Provision WAREHOUSE_HERMES_MCP_KEY using ./configure.py}
      WAREHOUSE_HERMES_MEMORY_KEY: ${WAREHOUSE_HERMES_MEMORY_KEY:-company}
      WAREHOUSE_HERMES_URL: http://hermes:8642
      WAREHOUSE_JWT_SECRET: ${WAREHOUSE_JWT_SECRET:?Provision WAREHOUSE_JWT_SECRET using ./configure.py}
      WAREHOUSE_LIVE_APP_CAPTURE_DIR: /app/data/captures
      WAREHOUSE_LOGIN_PASSWORD: ${WAREHOUSE_LOGIN_PASSWORD:-}
      WAREHOUSE_LOGIN_UI: lens
      WAREHOUSE_MCP_KEY: ${WAREHOUSE_MCP_KEY:?Provision WAREHOUSE_MCP_KEY using ./configure.py}
      WAREHOUSE_MCP_PORT: '8765'
      WAREHOUSE_MCP_STATIC_CALLER: ${WAREHOUSE_MCP_STATIC_CALLER:-}
      WAREHOUSE_PG_LOGIN_ROLE: ${WAREHOUSE_PG_LOGIN_ROLE:-rvbbit_users}
      WAREHOUSE_PUBLIC_URL: ${WAREHOUSE_PUBLIC_URL:?Provision the browser-facing origin using ./configure.py}
      WAREHOUSE_SEMANTIC_ENRICHMENT: ${WAREHOUSE_SEMANTIC_ENRICHMENT:-1}
      WAREHOUSE_SEMANTIC_ENRICH_MAX_ATTEMPTS: ${WAREHOUSE_SEMANTIC_ENRICH_MAX_ATTEMPTS:-3}
      WAREHOUSE_SEMANTIC_ENRICH_MODEL: ${WAREHOUSE_SEMANTIC_ENRICH_MODEL:-calliope}
      WAREHOUSE_SEMANTIC_ENRICH_RENDER_WAIT_MS: ${WAREHOUSE_SEMANTIC_ENRICH_RENDER_WAIT_MS:-3000}
      WAREHOUSE_SEMANTIC_ENRICH_SOURCE_CHARS: ${WAREHOUSE_SEMANTIC_ENRICH_SOURCE_CHARS:-180000}
      WAREHOUSE_STATE_FILE: /app/data/oauth_state.json
      WAREHOUSE_TEAM_BOOTSTRAP_ADMINS: ${WAREHOUSE_TEAM_BOOTSTRAP_ADMINS:?Provision the bootstrap Admins Team email
        using ./configure.py}
      CALLIOPE_COMPUTER_DEBUG: ${CALLIOPE_COMPUTER_DEBUG:-false}
      CALLIOPE_COMPUTER_ENABLED: ${CALLIOPE_COMPUTER_ENABLED:-${CALLIOPE_COMPUTER_DEBUG:-false}}
      CALLIOPE_DESKTOP_VNC_URL: ${CALLIOPE_DESKTOP_VNC_URL:-https://desktop:6901}
      CALLIOPE_EVIDENCE_RANKING_MODE: ${CALLIOPE_EVIDENCE_RANKING_MODE:-select}
      CALLIOPE_HINDSIGHT_METADATA_ONLY: 'true'
      CALLIOPE_MEMORY_EXTRACTOR: ${CALLIOPE_MEMORY_EXTRACTOR:-calliope}
      CALLIOPE_MEMORY_INFERENCE_BASE_URL: ${RVBBIT_CLOVER_OPENAI_BASE_URL:-http://clover:8090/v1}
      CALLIOPE_MEMORY_SCOPE: ${CALLIOPE_MEMORY_SCOPE:-shared}
      CALLIOPE_SPECIALIST_FANOUT_CONCURRENCY: ${CALLIOPE_SPECIALIST_FANOUT_CONCURRENCY:-4}
      CALLIOPE_SPECIALIST_MODEL_SHADOW: ${CALLIOPE_SPECIALIST_MODEL_SHADOW:-off}
      CALLIOPE_SPECIALIST_MODEL_SHADOW_OWNERS: ${CALLIOPE_SPECIALIST_MODEL_SHADOW_OWNERS:-}
      CALLIOPE_SPECIALIST_MODEL_SHADOW_SESSIONS: ${CALLIOPE_SPECIALIST_MODEL_SHADOW_SESSIONS:-}
      CALLIOPE_STAGE_CONTEXT_MODE: ${CALLIOPE_STAGE_CONTEXT_MODE:-off}
      CALLIOPE_STAGE_CONTEXT_OWNERS: ${CALLIOPE_STAGE_CONTEXT_OWNERS:-}
      CALLIOPE_STAGE_CONTEXT_SESSIONS: ${CALLIOPE_STAGE_CONTEXT_SESSIONS:-}
      WAREHOUSE_CALLIOPE_DEBUG_TOKEN_METER: ${WAREHOUSE_CALLIOPE_DEBUG_TOKEN_METER:-true}
      WAREHOUSE_CALLIOPE_DESKTOP_CONTROL_KEY: ${CALLIOPE_DESKTOP_CONTROL_KEY:-}
      WAREHOUSE_CALLIOPE_DESKTOP_IMAGE_REF: ${CALLIOPE_DESKTOP_IMAGE_REF:-${CALLIOPE_REGISTRY:-ghcr.io/ryrobes}/calliope-desktop:${CALLIOPE_VERSION:-1.2.1}}
      WAREHOUSE_CALLIOPE_DESKTOP_IMAGE_REVISION: ${CALLIOPE_DESKTOP_IMAGE_REVISION:-${CALLIOPE_REVISION:-unknown}}
      WAREHOUSE_CALLIOPE_DESKTOP_STORAGE: /var/lib/calliope-desktop
      WAREHOUSE_CALLIOPE_DESKTOP_URL: ${CALLIOPE_DESKTOP_URL:-http://desktop:9000}
      WAREHOUSE_CALLIOPE_DESKTOP_VNC_BASIC: ${CALLIOPE_DESKTOP_VNC_BASIC:-}
      WAREHOUSE_CALLIOPE_DESKTOP_VNC_VIEW_BASIC: ${CALLIOPE_DESKTOP_VNC_VIEW_BASIC:-}
      WAREHOUSE_CALLIOPE_DREAM_HERMES_TIMEOUT_SECONDS: ${WAREHOUSE_CALLIOPE_DREAM_HERMES_TIMEOUT_SECONDS:-900}
      WAREHOUSE_CALLIOPE_TTS_HUTCH_BASE_URL: ${WAREHOUSE_CALLIOPE_TTS_HUTCH_BASE_URL:-http://clover:8090/v1}
      WAREHOUSE_CALLIOPE_TTS_HUTCH_KEY: ${WAREHOUSE_CALLIOPE_TTS_HUTCH_KEY:-}
      WAREHOUSE_CALLIOPE_TTS_HUTCH_MODEL: ${WAREHOUSE_CALLIOPE_TTS_HUTCH_MODEL:-calliope-voice}
      WAREHOUSE_CALLIOPE_TTS_PROVIDER: ${WAREHOUSE_CALLIOPE_TTS_PROVIDER:-hutch}
      WAREHOUSE_CONTROL_WORKERS: ${WAREHOUSE_CONTROL_WORKERS:-4}
      WAREHOUSE_DASH_QUERY_CACHE_MAX_ENTRIES: ${WAREHOUSE_DASH_QUERY_CACHE_MAX_ENTRIES:-512}
      WAREHOUSE_DASH_QUERY_CACHE_TTL_SECONDS: ${WAREHOUSE_DASH_QUERY_CACHE_TTL_SECONDS:-90}
      WAREHOUSE_DASH_QUERY_WORKERS: ${WAREHOUSE_DASH_QUERY_WORKERS:-8}
      WAREHOUSE_HERMES_CONTROL_URL: http://hermes:8643
      WAREHOUSE_HERMES_INFERENCE_TIMEOUT_SECONDS: ${WAREHOUSE_HERMES_INFERENCE_TIMEOUT_SECONDS:-900}
      WAREHOUSE_HERMES_SKILLS_ROOT: /opt/data/skills
      WAREHOUSE_MAPBOX_STYLE_DARK: ${WAREHOUSE_MAPBOX_STYLE_DARK:-mapbox://styles/mapbox/dark-v11}
      WAREHOUSE_MAPBOX_STYLE_LIGHT: ${WAREHOUSE_MAPBOX_STYLE_LIGHT:-mapbox://styles/mapbox/light-v11}
      WAREHOUSE_MAPBOX_TOKEN: ${WAREHOUSE_MAPBOX_TOKEN:-}
      WAREHOUSE_MEANING_ENRICH: ${WAREHOUSE_MEANING_ENRICH:-1}
      WAREHOUSE_MEANING_ENRICH_BACKEND: ${WAREHOUSE_MEANING_ENRICH_BACKEND:-}
      WAREHOUSE_MEANING_ENRICH_BUDGET_USD: ${WAREHOUSE_MEANING_ENRICH_BUDGET_USD:-5}
      WAREHOUSE_MEANING_ENRICH_MODEL: ${WAREHOUSE_MEANING_ENRICH_MODEL:-calliope-sol}
      WAREHOUSE_MEANING_NARRATIVE_WORKER: ${WAREHOUSE_MEANING_NARRATIVE_WORKER:-1}
      WAREHOUSE_NATIVE_PUBLIC_URL: ${WAREHOUSE_NATIVE_PUBLIC_URL:-}
      WAREHOUSE_SQL_MULTI_WORKERS: ${WAREHOUSE_SQL_MULTI_WORKERS:-6}
      CALLIOPE_OPENROUTER_KEY_FILE: /run/clover-credentials/openrouter.key
      RVBBIT_CLOVER_BASE_URL: http://clover:8090
      CALLIOPE_COMPUTER_CHOOSER_BASE: http://clover:8090
      CLOVER_DECISION_MODEL: typesafe/jev-1.13
      CALLIOPE_UI_STUDIO_URL: http://ui-studio:18456
      CALLIOPE_UI_STUDIO_TOKEN_FILE: /run/secrets/studio-token
    extra_hosts:
    - host.docker.internal:host-gateway
    init: true
    image: ${CALLIOPE_REGISTRY:-ghcr.io/ryrobes}/calliope-server:${CALLIOPE_VERSION:-1.2.1}
    networks:
      default: null
    restart: unless-stopped
    volumes:
    - source: rvbbit_warehouse_mcp
      target: /app/data
      type: volume
      volume: {}
    - read_only: true
      source: rvbbit_hermes
      target: /opt/data
      type: volume
      volume: {}
    - read_only: true
      source: rvbbit_desktop
      target: /var/lib/calliope-desktop
      type: volume
      volume: {}
    - type: bind
      source: ./state/clover/credentials
      target: /run/clover-credentials
      read_only: false
      bind:
        create_host_path: false
    - type: bind
      source: ./state/studio-token
      target: /run/secrets/studio-token
      read_only: true
      bind:
        create_host_path: false
  datarabbit:
    depends_on:
      postgres:
        condition: service_healthy
        required: true
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DOCKER_HOST: ${RVBBIT_DOCKER_HOST:-unix:///var/run/docker.sock}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GMEET_ACL_MODE: ${GMEET_ACL_MODE:-calendar_invitees_strict}
      GMEET_ADMIN_SUBJECT: ${GMEET_ADMIN_SUBJECT:-}
      GMEET_AUTO_TRANSCRIBE: ${GMEET_AUTO_TRANSCRIBE:-false}
      GMEET_AUTO_TRANSCRIBE_DAYS: ${GMEET_AUTO_TRANSCRIBE_DAYS:-7}
      GMEET_CALENDAR_LOOKUP: ${GMEET_CALENDAR_LOOKUP:-true}
      GMEET_CONNECTOR_TOKEN: ${GMEET_CONNECTOR_TOKEN:-}
      GMEET_DISCOVER_USERS: ${GMEET_DISCOVER_USERS:-true}
      GMEET_DOMAIN: ${GMEET_DOMAIN:-}
      GMEET_DRIVE_ACL: ${GMEET_DRIVE_ACL:-true}
      GMEET_LOOKBACK_DAYS: ${GMEET_LOOKBACK_DAYS:-29}
      GMEET_MAX_SUBJECTS: ${GMEET_MAX_SUBJECTS:-500}
      GMEET_SA_KEY_FILE: /run/secrets/gmeet-service-account.json
      GMEET_SUBJECTS: ${GMEET_SUBJECTS:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_QUOTA_PROJECT: ${GOOGLE_CLOUD_QUOTA_PROJECT:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      RVBBIT_APP_BASE: ${WAREHOUSE_PUBLIC_URL:-}
      RVBBIT_APP_BASE_INTERNAL: http://calliope:8765
      RVBBIT_AUTH_INTERNAL: http://calliope:8765
      RVBBIT_CAPABILITY_CLI: ${RVBBIT_CAPABILITY_CLI:-/usr/share/rvbbit/capabilities/tools/rvbbit-capability}
      RVBBIT_CAPABILITY_ROOT: ${RVBBIT_CAPABILITY_ROOT:-/usr/share/rvbbit/capabilities}
      RVBBIT_DOCKER_NETWORK: ${COMPOSE_PROJECT_NAME:-calliope}
      RVBBIT_LENS_HOME: /data
      RVBBIT_LENS_SEED_DSN: postgresql://postgres:${POSTGRES_PASSWORD:?Provision POSTGRES_PASSWORD using ./configure.py}@postgres:5432/${POSTGRES_DB:-rvbbit}
      RVBBIT_LOCAL_WORK_ROOT: ${RVBBIT_LOCAL_WORK_ROOT:-/data}
      RVBBIT_MODE: burrow
      WAREHOUSE_MCP_KEY: ${WAREHOUSE_MCP_KEY:-}
    image: ${CALLIOPE_REGISTRY:-ghcr.io/ryrobes}/calliope-datarabbit:${CALLIOPE_VERSION:-1.2.1}
    networks:
      default: null
    restart: unless-stopped
    volumes:
    - source: rvbbit_lens
      target: /data
      type: volume
      volume: {}
    - source: ${RVBBIT_DOCKER_SOCKET:-/var/run/docker.sock}
      target: /var/run/docker.sock
      type: bind
      bind:
        create_host_path: false
  desktop:
    environment:
      CALLIOPE_BROWSER_RENDERER: ${CALLIOPE_BROWSER_RENDERER:-software}
      CALLIOPE_COMPUTER_DECISION_URL: ${CALLIOPE_COMPUTER_DECISION_URL:-http://calliope:8765/api/calliope/computer/decide}
      CALLIOPE_DESKTOP_CONTROL_KEY: ${CALLIOPE_DESKTOP_CONTROL_KEY:?Run configure.py}
      CALLIOPE_DESKTOP_STORAGE: /var/lib/calliope-desktop
      MAX_FRAME_RATE: ${CALLIOPE_DESKTOP_MAX_FRAME_RATE:-24}
      VNC_PW: ${CALLIOPE_DESKTOP_VNC_PASSWORD:?Run configure.py}
      VNC_RESOLUTION: ${CALLIOPE_DESKTOP_RESOLUTION:-1280x720}
      VNC_VIEW_ONLY_PW: ${CALLIOPE_DESKTOP_VNC_VIEW_PASSWORD:-}
    expose:
    - '6901'
    - '9000'
    healthcheck:
      interval: 5s
      retries: 60
      start_period: 20s
      test:
      - CMD-SHELL
      - python3 -c "import json,os,urllib.request; r=urllib.request.Request('http://127.0.0.1:9000/health',headers={'X-Calliope-Desktop-Key':os.environ['CALLIOPE_DESKTOP_CONTROL_KEY']});
        assert json.load(urllib.request.urlopen(r,timeout=3))['ready']"
      timeout: 5s
    image: ${CALLIOPE_REGISTRY:-ghcr.io/ryrobes}/calliope-desktop:${CALLIOPE_VERSION:-1.2.1}
    networks:
      default: null
    profiles:
    - computer
    restart: unless-stopped
    shm_size: 1gb
    stop_grace_period: 30s
    volumes:
    - source: rvbbit_desktop
      target: /var/lib/calliope-desktop
      type: volume
      volume: {}
    - source: rvbbit_desktop_home
      target: /home/kasm-user
      type: volume
      volume: {}
  doc-extract:
    image: ${CALLIOPE_REGISTRY:-ghcr.io/ryrobes}/calliope-doc-extract:${CALLIOPE_VERSION:-1.2.1}
    networks:
      default: null
    restart: unless-stopped
    volumes:
    - source: rvbbit_staging
      target: /staging
      type: volume
      volume: {}
  duck:
    command:
    - sh
    - -ec
    - "until pg_isready -h postgres -p 5432 -U postgres -d \"$${POSTGRES_DB:-rvbbit}\"; do\n  sleep 2\ndone\nexec\
      \ rvbbit-duck \\\n  --serve-derived-socket \\\n  --workers \"$${RVBBIT_DUCK_WORKERS:-4}\" \\\n  --engine \"\
      ${RVBBIT_DUCK_ENGINE:-duck}\" \\\n  --layout \"${RVBBIT_DUCK_LAYOUT:-vortex}\" \\\n  --dsn \"$${RVBBIT_DSN}\"\
      \ \\\n  --threads \"$${RVBBIT_DUCK_THREADS:-4}\" \\\n  --pgdata-prefix \"$${RVBBIT_PGDATA_PREFIX:-/var/lib/postgresql}\"\
      \ \\\n  --visible-pgdata-prefix \"$${RVBBIT_VISIBLE_PGDATA_PREFIX:-/var/lib/postgresql}\"\n"
    depends_on:
      postgres:
        condition: service_healthy
        required: true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rvbbit}
      RVBBIT_ARROW_IPC_DIR: ${RVBBIT_ARROW_IPC_DIR:-/tmp/rvbbit-arrow-ipc}
      RVBBIT_DSN: postgresql://postgres:${POSTGRES_PASSWORD:?Provision POSTGRES_PASSWORD using ./configure.py}@postgres:5432/${POSTGRES_DB:-rvbbit}
      RVBBIT_DUCK_BACKEND_SHARED_DIR: ${RVBBIT_DUCK_BACKEND_SHARED_DIR:-/run/rvbbit/duck}
      RVBBIT_DUCK_BIN: ${RVBBIT_DUCK_BIN:-/usr/local/bin/rvbbit-duck}
      RVBBIT_DUCK_BROKER_QUEUE: ${RVBBIT_DUCK_BROKER_QUEUE:-1024}
      RVBBIT_DUCK_CONTROL_LOCK_TIMEOUT_MS: ${RVBBIT_DUCK_CONTROL_LOCK_TIMEOUT_MS:-500}
      RVBBIT_DUCK_CONTROL_STATEMENT_TIMEOUT_MS: ${RVBBIT_DUCK_CONTROL_STATEMENT_TIMEOUT_MS:-30000}
      RVBBIT_DUCK_MAX_REQUEST_BYTES: ${RVBBIT_DUCK_MAX_REQUEST_BYTES:-16777216}
      RVBBIT_DUCK_NODE_ID: ${RVBBIT_DUCK_NODE_ID:-compose-duck}
      RVBBIT_DUCK_SOCKET_IO_TIMEOUT_S: ${RVBBIT_DUCK_SOCKET_IO_TIMEOUT_S:-30}
      RVBBIT_DUCK_THREADS: ${RVBBIT_DUCK_THREADS:-4}
      RVBBIT_DUCK_WORKERS: ${RVBBIT_DUCK_BACKEND_SHARED_WORKERS:-4}
      RVBBIT_PGDATA_PREFIX: ${RVBBIT_PGDATA_PREFIX:-/var/lib/postgresql}
      RVBBIT_VISIBLE_PGDATA_PREFIX: ${RVBBIT_VISIBLE_PGDATA_PREFIX:-/var/lib/postgresql}
    healthcheck:
      interval: 5s
      retries: 30
      test:
      - CMD-SHELL
      - workers=$${RVBBIT_DUCK_WORKERS:-4}; live=$$(grep -l '^rvbbit-duck-wor' /proc/1/task/*/comm 2>/dev/null |
        wc -l); test "$$live" -ge "$$workers" && find /run/rvbbit/duck -maxdepth 1 -type s -name 'rvbbit-duck-*.sock'
        | grep -q .
      timeout: 3s
    image: ${CALLIOPE_REGISTRY:-ghcr.io/ryrobes}/calliope-postgres:${CALLIOPE_VERSION:-1.2.1}
    networks:
      default: null
    restart: unless-stopped
    volumes:
    - source: rvbbit_duck_run
      target: /run/rvbbit
      type: volume
      volume: {}
    - source: rvbbit_duck_arrow_ipc
      target: /tmp/rvbbit-arrow-ipc
      type: volume
      volume: {}
    - read_only: true
      source: rvbbit_pgdata
      target: /var/lib/postgresql
      type: volume
      volume: {}
