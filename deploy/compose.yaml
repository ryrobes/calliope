  clover-research:
    image: ${CALLIOPE_REGISTRY:-ghcr.io/ryrobes}/calliope-clover-research:${CALLIOPE_VERSION:-1.2.1}
    env_file:
    - path: ./state/clover/providers.env
      format: raw
    - path: ./state/clover/research.env
      format: raw
    environment:
      OPENROUTER_API_KEY_FILE: /run/clover-credentials/openrouter.key
      CLOVER_RESEARCH_BIND: 0.0.0.0:8092
      CLOVER_RESEARCH_SCRAPE_URL: http://clover-web:8091/v1/scrape
    volumes:
    - type: bind
      source: ./state/clover/credentials
      target: /run/clover-credentials
      read_only: true
      bind:
        create_host_path: false
    depends_on:
      clover-web:
        condition: service_started
      storage-init:
        condition: service_completed_successfully
    restart: unless-stopped
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    mem_limit: 512m
    cpus: 2.0
  storage-init:
    image: ${CALLIOPE_REGISTRY:-ghcr.io/ryrobes}/calliope-postgres:${CALLIOPE_VERSION:-1.2.1}
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint:
    - bash
    - -ec
    command:
    - psql "$$RVBBIT_DSN" -X -v ON_ERROR_STOP=1 -f /config/ledger-bootstrap.sql -f /config/research-bootstrap.sql
    environment:
      RVBBIT_DSN: postgresql://postgres:${POSTGRES_PASSWORD:?Run configure.py}@postgres:5432/rvbbit
    volumes:
    - type: bind
      source: ./state/clover/ledger-bootstrap.sql
      target: /config/ledger-bootstrap.sql
      read_only: true
      bind:
        create_host_path: false
    - type: bind
      source: ./state/clover/research-bootstrap.sql
      target: /config/research-bootstrap.sql
      read_only: true
      bind:
        create_host_path: false
  clover-analytics:
    image: ${CALLIOPE_REGISTRY:-ghcr.io/ryrobes}/calliope-clover-analytics:${CALLIOPE_VERSION:-1.2.1}
    environment:
      ANALYTICS_THREADS: ${CLOVER_ANALYTICS_THREADS:-2}
    env_file:
    - path: ./state/clover/client.env
      format: raw
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=3)
      interval: 15s
      timeout: 5s
      retries: 5
  clover-gliner:
    image: ${CALLIOPE_REGISTRY:-ghcr.io/ryrobes}/calliope-clover-gliner:${CALLIOPE_VERSION:-1.2.1}
    profiles:
    - specialists
    environment:
      HF_HOME: /models
      MODEL_THREADS: '2'
    volumes:
    - type: volume
      source: clover_models_gliner
      target: /models
      read_only: false
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=3)
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 120s
  clover-tspulse:
    image: ${CALLIOPE_REGISTRY:-ghcr.io/ryrobes}/calliope-clover-tspulse:${CALLIOPE_VERSION:-1.2.1}
    profiles:
    - specialists
    environment:
      HF_HOME: /models
      MODEL_THREADS: '2'
    volumes:
    - type: volume
      source: clover_models_tspulse
      target: /models
      read_only: false
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health',timeout=3)
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 120s
  ui-studio:
    image: ${CALLIOPE_REGISTRY:-ghcr.io/ryrobes}/calliope-ui-studio:${CALLIOPE_VERSION:-1.2.1}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
    - ALL
    security_opt:
    - no-new-privileges:true
    pids_limit: 256
    mem_limit: 6g
    cpus: 4
    tmpfs:
    - /tmp:size=1g,mode=1777
    environment:
      STUDIO_TOKEN_FILE: /run/secrets/studio-token
      STUDIO_REVISION: ${CALLIOPE_REVISION}
      XDG_CACHE_HOME: /tmp/cache
      CALLIOPE_DECISION_URL: http://calliope:8765/api/calliope/ui/decision
    volumes:
    - type: bind
      source: ./state/studio-token
      target: /run/secrets/studio-token
      read_only: true
      bind:
        create_host_path: false
    - type: volume
      source: ui_studio
      target: /var/lib/calliope-ui-studio
      read_only: false
    healthcheck:
      test:
      - CMD
      - python3
      - -c
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:18456/health',timeout=3)
      interval: 15s
      timeout: 5s
      retries: 5
volumes:
  rvbbit_desktop: {}
  rvbbit_desktop_home: {}
  rvbbit_duck_arrow_ipc: {}
  rvbbit_duck_run: {}
  rvbbit_hermes: {}
  rvbbit_lens: {}
  rvbbit_origin_config: {}
  rvbbit_origin_data: {}
  rvbbit_pgdata: {}
  rvbbit_staging: {}
  rvbbit_warehouse_mcp: {}
  rvbbit_warren: {}
  clover_models_gliner: {}
  clover_models_tspulse: {}
  ui_studio: {}
