# Unix sockets belong to the database container's own administrative processes.
local all all trust
# SQL clients authenticate with normal PostgreSQL passwords over TLS.
hostssl all all all scram-sha-256
# Internal Rust services currently use plaintext PostgreSQL on the Compose bridge.
# This exception is address-based, not a public-port boundary: NAT/VPN endpoints
# that masquerade into this subnet should require TLS in their client config too.
hostnossl all all samenet scram-sha-256
hostnossl all all all reject
