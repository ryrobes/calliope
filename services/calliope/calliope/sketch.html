<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="color-scheme" content="dark light">
  <title>Calliope Sketch</title>
  <link rel="stylesheet" href="/theme/superior-fonts.css">
  <link rel="stylesheet" href="/calliope/workspace-ui.css?v=__CALLIOPE_ASSET_VERSION__">
  <style>html,body,#sketch-root{width:100%;height:100%;margin:0;overflow:hidden;background:var(--sketch-bg,Canvas)}.sketch-loading{position:fixed;inset:0;display:grid;place-content:center;color:var(--sketch-dim,CanvasText);font:12px var(--font-superior-sans);text-align:center}.sketch-loading i{width:38px;height:38px;margin:0 auto 12px;border:1px solid var(--sketch-line,GrayText);border-top-color:var(--sketch-accent,Highlight);border-radius:50%;animation:spin .9s linear infinite}.sketch-loading strong,.sketch-loading span{display:block}.sketch-loading strong{color:var(--sketch-bright,CanvasText);letter-spacing:.08em;text-transform:uppercase}.sketch-loading span{margin-top:8px}@keyframes spin{to{transform:rotate(360deg)}}</style>
  <link rel="stylesheet" href="/calliope/sketch-runtime.css?v=__CALLIOPE_ASSET_VERSION__">
</head>
<body data-excalifont="__CALLIOPE_EXCALIFONT__">
  <div id="sketch-root" data-sketch-id="__SKETCH_ID__" data-read-only="__SKETCH_READ_ONLY__" data-source-url="__SKETCH_SOURCE_URL__" data-presentation="__SKETCH_PRESENTATION__">
    <div class="sketch-loading"><i></i><strong>Opening shared sketch</strong><span>Restoring the latest sketch</span></div>
  </div>
  <script src="/calliope/sketch-bootstrap.js?v=__CALLIOPE_ASSET_VERSION__"></script>
</body>
</html>
