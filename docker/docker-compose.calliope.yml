name: calliope

# Development appliance overlay. Not the Calliope install path
# (https://usecalliope.com/install.sh, deploy/compose.yaml). This file
# extends the generic uber service definitions and makes hosted-only
# dependencies explicit. Run from the repository root only when working
# on that overlay:
#
#   docker compose --env-file /opt/rvbbit/.env \
#     -f docker/docker-compose.calliope.yml up -d

services:
  postgres:
    extends:
      file: docker-compose.uber.yml
      service: postgres
    # Docker's default /dev/shm is 64 MB; with shared_buffers=1GB, work_mem=64MB
    # and 4 parallel workers, one parallel hash join wants a ~265 MB DSA segment
    # and every such query fails with "could not resize shared memory segment …
    # No space left on device". Hindsight's retain pipeline hit this on EVERY
    # specialist memory write (2026-08-19) — the appliance was silently losing
    # agent memory. Size shm to breathe.
    shm_size: 1gb
    image: ${CALLIOPE_REGISTRY:-ghcr.io/ryrobes}/calliope-postgres:${CALLIOPE_VERSION:-1.2.1}
    build:
      context: ..
      dockerfile: docker/Dockerfile.rvbbit
      labels:
        org.opencontainers.image.title: Calliope Postgres
        org.opencontainers.image.version: ${CALLIOPE_VERSION:-1.2.1}
        org.opencontainers.image.revision: ${CALLIOPE_REVISION:-unknown}
    container_name: calliope-postgres
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Provision POSTGRES_PASSWORD in /opt/rvbbit/.env}
      RVBBIT_CLOVER_KEY: ${RVBBIT_CLOVER_KEY:?Provision RVBBIT_CLOVER_KEY in /opt/rvbbit/.env}
      RVBBIT_CLOVER_INSTALL_SOURCE: shipped
      RVBBIT_CREDENTIAL_KEY: ${RVBBIT_CREDENTIAL_KEY:?Provision RVBBIT_CREDENTIAL_KEY in /opt/rvbbit/.env}
      RVBBIT_GATEWAY_TOKEN: ${RVBBIT_GATEWAY_TOKEN:?Provision RVBBIT_GATEWAY_TOKEN in /opt/rvbbit/.env}

  duck:
    extends:
      file: docker-compose.uber.yml
      service: duck
    image: ${CALLIOPE_REGISTRY:-ghcr.io/ryrobes}/calliope-postgres:${CALLIOPE_VERSION:-1.2.1}
    container_name: calliope-duck
    environment:
      RVBBIT_DSN: postgresql://postgres:${POSTGRES_PASSWORD:?Provision POSTGRES_PASSWORD in /opt/rvbbit/.env}@postgres:5432/${POSTGRES_DB:-rvbbit}

  datarabbit:
    extends:
      file: docker-compose.uber.yml
      service: lens
    image: ${CALLIOPE_REGISTRY:-ghcr.io/ryrobes}/calliope-datarabbit:${CALLIOPE_VERSION:-1.2.1}
    build:
      context: ..
      dockerfile: datarabbit/Dockerfile.calliope
      labels:
        org.opencontainers.image.title: Calliope DataRabbit
        org.opencontainers.image.version: ${CALLIOPE_VERSION:-1.2.1}
        org.opencontainers.image.revision: ${CALLIOPE_REVISION:-unknown}
    container_name: calliope-datarabbit
    environment:
      # Hosted DataRabbit is the appliance's authenticated diagnostic console.
      # It introspects the Warehouse wh_session; it never owns an OAuth secret.
      RVBBIT_MODE: burrow
      RVBBIT_APP_BASE_INTERNAL: http://calliope:8765
      RVBBIT_AUTH_INTERNAL: http://calliope:8765
      RVBBIT_DOCKER_NETWORK: ${CALLIOPE_DOCKER_NETWORK:-calliope}
      RVBBIT_LENS_SEED_DSN: postgresql://postgres:${POSTGRES_PASSWORD:?Provision POSTGRES_PASSWORD in /opt/rvbbit/.env}@postgres:5432/${POSTGRES_DB:-rvbbit}
    # The direct Next listener cannot complete login/OAuth routing. Keep it as
    # a loopback-only break-glass probe; use the Burrow origin port below.
    ports: !override
      - "${RVBBIT_LENS_PORT:-127.0.0.1:3000}:3000"

  warren:
    extends:
      file: docker-compose.uber.yml
      service: warren
    image: ${CALLIOPE_REGISTRY:-ghcr.io/ryrobes}/calliope-warren:${CALLIOPE_VERSION:-1.2.1}
    build:
      context: ..
      dockerfile: docker/Dockerfile.warren-agent
      labels:
        org.opencontainers.image.title: Calliope Warren
        org.opencontainers.image.version: ${CALLIOPE_VERSION:-1.2.1}
        org.opencontainers.image.revision: ${CALLIOPE_REVISION:-unknown}
    container_name: calliope-warren
    environment:
      RVBBIT_DSN: postgresql://postgres:${POSTGRES_PASSWORD:?Provision POSTGRES_PASSWORD in /opt/rvbbit/.env}@postgres:5432/${POSTGRES_DB:-rvbbit}
      RVBBIT_DOCKER_NETWORK: ${CALLIOPE_DOCKER_NETWORK:-calliope}
      RVBBIT_GATEWAY_TOKEN: ${RVBBIT_GATEWAY_TOKEN:?Provision RVBBIT_GATEWAY_TOKEN in /opt/rvbbit/.env}
      RVBBIT_MIRROR_TOKEN: ${RVBBIT_MIRROR_TOKEN:?Provision RVBBIT_MIRROR_TOKEN in /opt/rvbbit/.env}
      RVBBIT_REQUIRE_CANONICAL_CREDENTIALS: "true"

  bootstrap:
    extends:
      file: docker-compose.uber.yml
      service: bootstrap
    image: ${CALLIOPE_REGISTRY:-ghcr.io/ryrobes}/calliope-postgres:${CALLIOPE_VERSION:-1.2.1}
    container_name: calliope-bootstrap
    environment:
      RVBBIT_DSN: postgresql://postgres:${POSTGRES_PASSWORD:?Provision POSTGRES_PASSWORD in /opt/rvbbit/.env}@postgres:5432/${POSTGRES_DB:-rvbbit}
      RVBBIT_LENS_CONNECTION_LABEL: ${RVBBIT_LENS_CONNECTION_LABEL:-Calliope}
      RVBBIT_LENS_CONNECTION_PASSWORD: ${POSTGRES_PASSWORD:?Provision POSTGRES_PASSWORD in /opt/rvbbit/.env}
      RVBBIT_UBER_BOOTSTRAP_CAPABILITIES: ${RVBBIT_UBER_BOOTSTRAP_CAPABILITIES:-runtimes/python-runtime,runtimes/mcp-gateway,data/dlt-mirror}
      RVBBIT_CLOVER_KEY: ${RVBBIT_CLOVER_KEY:?Provision RVBBIT_CLOVER_KEY in /opt/rvbbit/.env}
      RVBBIT_CLOVER_REQUIRED: "true"
      RVBBIT_CLOVER_VERIFY_REMOTE: "true"
      RVBBIT_CLOVER_INSTALL_SOURCE: shipped
      RVBBIT_CLOVER_OPENAI_BASE_URL: ${RVBBIT_CLOVER_OPENAI_BASE_URL:-http://clover:8090/v1}
      RVBBIT_CLOVER_REQUIRED_MODEL: ${RVBBIT_CLOVER_REQUIRED_MODEL:-calliope}
      RVBBIT_HOSTED_SERVICES: "true"
      RVBBIT_HINDSIGHT_ENDPOINT: http://hindsight:8888

  doc-extract:
    extends:
      file: docker-compose.uber.yml
      service: doc-extract
    image: ${CALLIOPE_REGISTRY:-ghcr.io/ryrobes}/calliope-doc-extract:${CALLIOPE_VERSION:-1.2.1}
    build:
      context: ../sidecars/doc-extract
      dockerfile: Dockerfile
      labels:
        org.opencontainers.image.title: Calliope Document Extractor
        org.opencontainers.image.version: ${CALLIOPE_VERSION:-1.2.1}
        org.opencontainers.image.revision: ${CALLIOPE_REVISION:-unknown}
    container_name: calliope-doc-extract

  hindsight:
    image: ${RVBBIT_HINDSIGHT_IMAGE:-ghcr.io/vectorize-io/hindsight-api:1.2.1-slim@sha256:084af5a6522d67f5905f7992cdb3d910d778496e5dd2566caec7cf82ed2e7d8c}
    container_name: calliope-hindsight
    depends_on:
      bootstrap:
        condition: service_completed_successfully
    environment:
      HINDSIGHT_API_HOST: 0.0.0.0
      HINDSIGHT_API_PORT: "8888"
      HINDSIGHT_API_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Provision POSTGRES_PASSWORD in /opt/rvbbit/.env}@postgres:5432/${POSTGRES_DB:-rvbbit}
      HINDSIGHT_API_DATABASE_SCHEMA: hindsight
      HINDSIGHT_API_LLM_PROVIDER: openai
      HINDSIGHT_API_LLM_API_KEY: ${RVBBIT_CLOVER_KEY:?Provision RVBBIT_CLOVER_KEY in /opt/rvbbit/.env}
      # Memory extraction and consolidation run after every turn; the small model
      # does them well at about a tenth of the flagship chat model's cost.
      HINDSIGHT_API_LLM_MODEL: ${RVBBIT_HINDSIGHT_LLM_MODEL:-calliope-luna}
      # Without a fixed language the small model wrote some memories in French or
      # Spanish from English conversations. Set another language for non-English teams.
      HINDSIGHT_API_LLM_OUTPUT_LANGUAGE: ${RVBBIT_HINDSIGHT_OUTPUT_LANGUAGE:-English}
      HINDSIGHT_API_LLM_BASE_URL: ${RVBBIT_CLOVER_OPENAI_BASE_URL:-http://clover:8090/v1}
      HINDSIGHT_API_LLM_TRACE_ENABLED: "true"
      # Token accounting only; Warehouse installs a payload-stripping trigger.
      HINDSIGHT_API_LLM_TRACE_MAX_CHARS: "1"
      HINDSIGHT_API_LLM_TRACE_RETENTION_DAYS: "7"
      HINDSIGHT_API_EMBEDDINGS_PROVIDER: openai
      HINDSIGHT_API_EMBEDDINGS_OPENAI_API_KEY: ${RVBBIT_CLOVER_KEY:?Provision RVBBIT_CLOVER_KEY in /opt/rvbbit/.env}
      HINDSIGHT_API_EMBEDDINGS_OPENAI_MODEL: embed
      HINDSIGHT_API_EMBEDDINGS_OPENAI_BASE_URL: ${RVBBIT_CLOVER_OPENAI_BASE_URL:-http://clover:8090/v1}
      HINDSIGHT_API_RERANKER_PROVIDER: rrf
      HINDSIGHT_API_AUDIT_LOG_ENABLED: "true"
      HINDSIGHT_API_WORKER_ID: calliope-hindsight
    expose:
      - "8888"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8888/health', timeout=3).read()"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
    restart: unless-stopped

  hermes:
    image: ${CALLIOPE_REGISTRY:-ghcr.io/ryrobes}/calliope-hermes:${CALLIOPE_VERSION:-1.2.1}
    build:
      context: ..
      dockerfile: docker/Dockerfile.calliope-hermes
      labels:
        org.opencontainers.image.title: Calliope Hermes
        org.opencontainers.image.version: ${CALLIOPE_VERSION:-1.2.1}
        org.opencontainers.image.revision: ${CALLIOPE_REVISION:-unknown}
      args:
        HERMES_BASE_IMAGE: ${RVBBIT_HERMES_BASE_IMAGE:-nousresearch/hermes-agent@sha256:6bece0644e29a347e5ae17db43c36938c86f171c6f5e0cef18aa2075d331f3a3}
        CALLIOPE_REVISION: ${CALLIOPE_REVISION:-unknown}
    container_name: calliope-hermes
    depends_on:
      hindsight:
        # Memory is valuable but must not make the setup/admin surface
        # unavailable during a provider outage. Hindsight keeps its own
        # healthcheck and restart policy so the degraded state stays visible.
        condition: service_started
      calliope:
        # Warehouse must accept the first internal MCP handshake before
        # Hermes performs its bounded initial discovery. Otherwise upstream
        # parks the server after its startup retries and the first chat turn
        # has no governed query tools.
        condition: service_healthy
    environment:
      HERMES_UID: ${HERMES_UID:-10000}
      HERMES_GID: ${HERMES_GID:-10000}
      RVBBIT_CLOVER_KEY: ${RVBBIT_CLOVER_KEY:?Provision RVBBIT_CLOVER_KEY in /opt/rvbbit/.env}
      RVBBIT_CLOVER_OPENAI_BASE_URL: ${RVBBIT_CLOVER_OPENAI_BASE_URL:-http://clover:8090/v1}
      API_SERVER_ENABLED: "true"
      API_SERVER_KEY: ${WAREHOUSE_HERMES_API_KEY:?Provision WAREHOUSE_HERMES_API_KEY in /opt/rvbbit/.env}
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
      # Do not set API_SERVER_MODEL_NAME here. Upstream gives that environment
      # override precedence over the durable Hermes config, which would pin
      # headless sessions to the bootstrap Clover alias after an operator picks
      # another provider/model in Calliope.
      CALLIOPE_MODEL_CONTEXT_LENGTH: ${CALLIOPE_MODEL_CONTEXT_LENGTH:-262144}
      CALLIOPE_MODEL_MAX_TOKENS: ${CALLIOPE_MODEL_MAX_TOKENS:-32768}
      HINDSIGHT_MODE: local_external
      HINDSIGHT_API_URL: http://hindsight:8888
      HINDSIGHT_TIMEOUT: ${HINDSIGHT_TIMEOUT:-120}
      # shared: one memory per agent across every conversation; audience: recall only
      # what everyone in the conversation could see (memories always carry the tags).
      CALLIOPE_MEMORY_SCOPE: ${CALLIOPE_MEMORY_SCOPE:-shared}
      WAREHOUSE_HERMES_MCP_KEY: ${WAREHOUSE_HERMES_MCP_KEY:?Provision WAREHOUSE_HERMES_MCP_KEY in /opt/rvbbit/.env}
      HERMES_ENVIRONMENT_HINT: "Calliope is the appliance UI. Company data is local in RVBBIT Postgres; remote source credentials are used only by the dlt mirror controller. Dashboard scratch files and the Warehouse source_path handoff both use /opt/data; a local HTML path is never the finished deliverable. Save user-facing files under /opt/data/outputs for automatic Stage publication; keep tests and working files outside outputs/exports. Markdown file links and MEDIA attachments in your reply also publish files."
      # Browser Use harness: attach straight to the supervisor-kept Chromium's
      # CDP endpoint. Without this the harness falls back to scanning
      # $HOME/.config profile locks, which misses any chrome launched under a
      # profile name outside its allowlist (gateway runs as hermes, HOME=/opt/data).
      BU_CDP_URL: http://127.0.0.1:9222
      # Mirror a loopback public origin inside Hermes for its local browser.
      CALLIOPE_BROWSER_PUBLIC_URL: ${WAREHOUSE_PUBLIC_URL}
      CALLIOPE_BROWSER_INTERNAL_ORIGIN: http://origin:80
    # The durable wrapper keeps a narrow recovery API alive while restarting
    # the Hermes gateway child. A bad YAML candidate can therefore roll back
    # without requiring the agent process it just impaired.
    command: ["calliope-hermes-supervisor"]
    expose:
      - "8642"
      - "8643"
    volumes:
      - rvbbit_hermes:/opt/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -H \"Authorization: Bearer $${API_SERVER_KEY}\" http://127.0.0.1:8642/health >/dev/null && curl -fsS http://127.0.0.1:9222/json/version >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 20s
    restart: unless-stopped

  desktop:
    extends:
      file: docker-compose.computer-base.yml
      service: desktop
    profiles: ["computer"]

  calliope:
    extends:
      file: docker-compose.uber.yml
      service: warehouse-mcp
    profiles: !reset []
    image: ${CALLIOPE_REGISTRY:-ghcr.io/ryrobes}/calliope-server:${CALLIOPE_VERSION:-1.2.1}
    build:
      context: ..
      dockerfile: services/calliope/Dockerfile
      labels:
        org.opencontainers.image.title: Calliope Server
        org.opencontainers.image.version: ${CALLIOPE_VERSION:-1.2.1}
        org.opencontainers.image.revision: ${CALLIOPE_REVISION:-unknown}
    container_name: calliope-server
    # PID 1 must reap: Playwright's headless Chrome children are reparented to
    # it when they exit, and server.py never waits on them (zombies pile up).
    init: true
    depends_on:
      postgres:
        condition: service_healthy
      bootstrap:
        condition: service_completed_successfully
    environment:
      WAREHOUSE_DSN: postgresql://postgres:${POSTGRES_PASSWORD:?Provision POSTGRES_PASSWORD in /opt/rvbbit/.env}@postgres:5432/${POSTGRES_DB:-rvbbit}
      WAREHOUSE_LOGIN_PASSWORD: ${WAREHOUSE_LOGIN_PASSWORD:-}
      # Required even behind an SSH tunnel: blank selects API-key-only mode
      # and leaves a healthy server without browser login.
      WAREHOUSE_PUBLIC_URL: ${WAREHOUSE_PUBLIC_URL:?Provision the browser-facing origin in /opt/rvbbit/.env}
      WAREHOUSE_NATIVE_PUBLIC_URL: ${WAREHOUSE_NATIVE_PUBLIC_URL:-}
      WAREHOUSE_ALLOWED_EMAILS: ${WAREHOUSE_ALLOWED_EMAILS:?Provision one bootstrap administrator email in /opt/rvbbit/.env}
      WAREHOUSE_TEAM_BOOTSTRAP_ADMINS: ${WAREHOUSE_TEAM_BOOTSTRAP_ADMINS:?Provision the bootstrap Admins Team email in /opt/rvbbit/.env}
      WAREHOUSE_JWT_SECRET: ${WAREHOUSE_JWT_SECRET:?Provision WAREHOUSE_JWT_SECRET in /opt/rvbbit/.env}
      WAREHOUSE_MCP_KEY: ${WAREHOUSE_MCP_KEY:?Provision WAREHOUSE_MCP_KEY in /opt/rvbbit/.env}
      WAREHOUSE_HERMES_MCP_KEY: ${WAREHOUSE_HERMES_MCP_KEY:?Provision WAREHOUSE_HERMES_MCP_KEY in /opt/rvbbit/.env}
      WAREHOUSE_HERMES_URL: http://hermes:8642
      WAREHOUSE_HERMES_API_KEY: ${WAREHOUSE_HERMES_API_KEY:?Provision WAREHOUSE_HERMES_API_KEY in /opt/rvbbit/.env}
      WAREHOUSE_HERMES_CONTROL_URL: http://hermes:8643
      WAREHOUSE_HERMES_MEMORY_KEY: ${WAREHOUSE_HERMES_MEMORY_KEY:-company}
      # Meaning enrichment: the high-judgement route that proposes Jev
      # classifications, and its own daily cap (separate from the narrative budget).
      WAREHOUSE_MEANING_NARRATIVE_WORKER: ${WAREHOUSE_MEANING_NARRATIVE_WORKER:-1}
      WAREHOUSE_MEANING_ENRICH_MODEL: ${WAREHOUSE_MEANING_ENRICH_MODEL:-calliope-sol}
      WAREHOUSE_MEANING_ENRICH_BACKEND: ${WAREHOUSE_MEANING_ENRICH_BACKEND:-}
      WAREHOUSE_MEANING_ENRICH_BUDGET_USD: ${WAREHOUSE_MEANING_ENRICH_BUDGET_USD:-5}
      WAREHOUSE_MEANING_ENRICH: ${WAREHOUSE_MEANING_ENRICH:-1}
      # Long-form inference has a separate generous bound; health and control
      # probes retain their own short deadlines.
      WAREHOUSE_HERMES_INFERENCE_TIMEOUT_SECONDS: ${WAREHOUSE_HERMES_INFERENCE_TIMEOUT_SECONDS:-900}
      # Hermes utility rewrites and speech synthesis share this bounded
      # preparation window. The rewrite reserves time for the audio phase.
      WAREHOUSE_CALLIOPE_TTS_PROVIDER: ${WAREHOUSE_CALLIOPE_TTS_PROVIDER:-hutch}
      WAREHOUSE_CALLIOPE_SMS_SIMULATOR_ENABLED: ${WAREHOUSE_CALLIOPE_SMS_SIMULATOR_ENABLED:-0}
      WAREHOUSE_CALLIOPE_TTS_HUTCH_BASE_URL: ${WAREHOUSE_CALLIOPE_TTS_HUTCH_BASE_URL:-http://clover:8090/v1}
      WAREHOUSE_CALLIOPE_TTS_HUTCH_MODEL: ${WAREHOUSE_CALLIOPE_TTS_HUTCH_MODEL:-calliope-voice}
      WAREHOUSE_CALLIOPE_TTS_HUTCH_KEY: ${WAREHOUSE_CALLIOPE_TTS_HUTCH_KEY:-}
      WAREHOUSE_CALLIOPE_TTS_PREPARE_TIMEOUT_SECONDS: ${WAREHOUSE_CALLIOPE_TTS_PREPARE_TIMEOUT_SECONDS:-120}
      # Independent delivery-tag pass after the spoken-text rewrite.
      WAREHOUSE_CALLIOPE_TTS_TAG_MODEL: ${WAREHOUSE_CALLIOPE_TTS_TAG_MODEL:-calliope-luna}
      # Server-owned receipts must not write to the read-only Hermes volume.
      CALLIOPE_MEDIA_LEDGER_DIR: /app/data/media-ledger
      # Offline synthesis can legitimately outlive an interactive request.
      # This remains bounded and never changes the model route to Clover.
      WAREHOUSE_CALLIOPE_DREAM_HERMES_TIMEOUT_SECONDS: ${WAREHOUSE_CALLIOPE_DREAM_HERMES_TIMEOUT_SECONDS:-900}
      WAREHOUSE_CALLIOPE_DEBUG_TOKEN_METER: ${WAREHOUSE_CALLIOPE_DEBUG_TOKEN_METER:-true}
      # Optional Stage recall. Off by default; pilot may scope to named users/threads.
      CALLIOPE_STAGE_CONTEXT_MODE: ${CALLIOPE_STAGE_CONTEXT_MODE:-off}
      CALLIOPE_STAGE_CONTEXT_OWNERS: ${CALLIOPE_STAGE_CONTEXT_OWNERS:-}
      CALLIOPE_STAGE_CONTEXT_SESSIONS: ${CALLIOPE_STAGE_CONTEXT_SESSIONS:-}
      # Search suggestion relevance; automatically falls back without a provider key.
      CALLIOPE_EVIDENCE_RANKING_MODE: ${CALLIOPE_EVIDENCE_RANKING_MODE:-select}
      # Observational specialist model experiment; never changes model selection.
      CALLIOPE_SPECIALIST_MODEL_SHADOW: ${CALLIOPE_SPECIALIST_MODEL_SHADOW:-off}
      CALLIOPE_SPECIALIST_MODEL_SHADOW_OWNERS: ${CALLIOPE_SPECIALIST_MODEL_SHADOW_OWNERS:-}
      CALLIOPE_SPECIALIST_MODEL_SHADOW_SESSIONS: ${CALLIOPE_SPECIALIST_MODEL_SHADOW_SESSIONS:-}
      CALLIOPE_COMPUTER_DEBUG: ${CALLIOPE_COMPUTER_DEBUG:-false}
      CALLIOPE_COMPUTER_ENABLED: ${CALLIOPE_COMPUTER_ENABLED:-${CALLIOPE_COMPUTER_DEBUG:-false}}
      WAREHOUSE_CALLIOPE_DESKTOP_URL: ${CALLIOPE_DESKTOP_URL:-http://desktop:9000}
      CALLIOPE_DESKTOP_VNC_URL: ${CALLIOPE_DESKTOP_VNC_URL:-https://desktop:6901}
      WAREHOUSE_CALLIOPE_DESKTOP_CONTROL_KEY: ${CALLIOPE_DESKTOP_CONTROL_KEY:-}
      WAREHOUSE_CALLIOPE_DESKTOP_VNC_BASIC: ${CALLIOPE_DESKTOP_VNC_BASIC:-}
      WAREHOUSE_CALLIOPE_DESKTOP_VNC_VIEW_BASIC: ${CALLIOPE_DESKTOP_VNC_VIEW_BASIC:-}
      WAREHOUSE_CALLIOPE_DESKTOP_IMAGE_REF: ${CALLIOPE_DESKTOP_IMAGE_REF:-${CALLIOPE_REGISTRY:-ghcr.io/ryrobes}/calliope-desktop:${CALLIOPE_VERSION:-1.2.1}}
      WAREHOUSE_CALLIOPE_DESKTOP_IMAGE_REVISION: ${CALLIOPE_DESKTOP_IMAGE_REVISION:-${CALLIOPE_REVISION:-unknown}}
      WAREHOUSE_CALLIOPE_DESKTOP_STORAGE: /var/lib/calliope-desktop
      # Maps for hosted dashboards: a per-client, URL-restricted Mapbox public
      # token, served into the dashboard shim at render time (never stored in
      # an artifact). Empty = maps disabled; the shim still feature-detects.
      WAREHOUSE_MAPBOX_TOKEN: ${WAREHOUSE_MAPBOX_TOKEN:-}
      WAREHOUSE_MAPBOX_STYLE_LIGHT: ${WAREHOUSE_MAPBOX_STYLE_LIGHT:-mapbox://styles/mapbox/light-v11}
      WAREHOUSE_MAPBOX_STYLE_DARK: ${WAREHOUSE_MAPBOX_STYLE_DARK:-mapbox://styles/mapbox/dark-v11}
      RVBBIT_CLOVER_KEY: ${RVBBIT_CLOVER_KEY:?Provision RVBBIT_CLOVER_KEY in /opt/rvbbit/.env}
      RVBBIT_CLOVER_OPENAI_BASE_URL: ${RVBBIT_CLOVER_OPENAI_BASE_URL:-http://clover:8090/v1}
      RVBBIT_CLOVER_REQUIRED_MODEL: ${RVBBIT_CLOVER_REQUIRED_MODEL:-calliope}
      WAREHOUSE_SEMANTIC_ENRICHMENT: ${WAREHOUSE_SEMANTIC_ENRICHMENT:-1}
      # Evaluate calliope-luna for semantic compilation; deployments can
      # override this model independently of the main Calliope chat route.
      WAREHOUSE_SEMANTIC_ENRICH_MODEL: ${WAREHOUSE_SEMANTIC_ENRICH_MODEL:-calliope}
      # Dashboard reads remain parallel, but they do not share the generic
      # ASGI worker pool with auth/admin traffic. Identical viewer queries are
      # singleflighted and briefly cached above the governed SQL contract.
      WAREHOUSE_DASH_QUERY_WORKERS: ${WAREHOUSE_DASH_QUERY_WORKERS:-8}
      WAREHOUSE_CONTROL_WORKERS: ${WAREHOUSE_CONTROL_WORKERS:-4}
      WAREHOUSE_SQL_MULTI_WORKERS: ${WAREHOUSE_SQL_MULTI_WORKERS:-6}
      # @all still runs specialists in parallel, but keeps enough Hutch lanes
      # free for Calliope to synthesize their completed replies.
      CALLIOPE_SPECIALIST_FANOUT_CONCURRENCY: ${CALLIOPE_SPECIALIST_FANOUT_CONCURRENCY:-4}
      WAREHOUSE_DASH_QUERY_CACHE_TTL_SECONDS: ${WAREHOUSE_DASH_QUERY_CACHE_TTL_SECONDS:-90}
      WAREHOUSE_DASH_QUERY_CACHE_MAX_ENTRIES: ${WAREHOUSE_DASH_QUERY_CACHE_MAX_ENTRIES:-512}
      # Warehouse owns both Calliope and Burrow browser sessions. Caddy sends
      # GET /login to Lens for presentation and every auth action back here.
      WAREHOUSE_LOGIN_UI: lens
      # Off unless an operator sets CALLIOPE_DEMO_MODE=1. See docs/DEMO_MODE.md.
      CALLIOPE_DEMO_MODE: ${CALLIOPE_DEMO_MODE:-0}
      CALLIOPE_DEMO_SCHEMAS: ${CALLIOPE_DEMO_SCHEMAS:-public_demo}
      CALLIOPE_DEMO_ROW_LIMIT: ${CALLIOPE_DEMO_ROW_LIMIT:-500}
      CALLIOPE_DEMO_QUERY_TIMEOUT_MS: ${CALLIOPE_DEMO_QUERY_TIMEOUT_MS:-5000}
      CALLIOPE_DEMO_QUERY_RATE: ${CALLIOPE_DEMO_QUERY_RATE:-2000}
      CALLIOPE_DEMO_QUERY_BURST: ${CALLIOPE_DEMO_QUERY_BURST:-400}
      CALLIOPE_DEMO_QUERY_CACHE_SECONDS: ${CALLIOPE_DEMO_QUERY_CACHE_SECONDS:-120}
      CALLIOPE_DEMO_GUEST_PASSWORD: ${CALLIOPE_DEMO_GUEST_PASSWORD:-}
      CALLIOPE_DEMO_GUEST_DSN: ${CALLIOPE_DEMO_GUEST_DSN:-}
      CALLIOPE_TRUSTED_PROXIES: ${CALLIOPE_APP_TRUSTED_PROXIES:-}
      # Hermes authors complete artifacts in its normal safe scratch volume.
      # Warehouse sees that same volume read-only at the identical path, so
      # upload_artifact(source_path=...) needs no copy or model retransmission.
      WAREHOUSE_CALLIOPE_EXPORT_ROOTS: /opt/data
      # Agent-staged source files are already shared read-only at these paths.
      WAREHOUSE_FILE_IMPORT_ROOTS: ${WAREHOUSE_FILE_IMPORT_ROOTS:-/opt/data/workspace:/opt/data/outputs:/app/data/brain-imports}
      WAREHOUSE_BRAIN_IMPORT_ROOTS: ${WAREHOUSE_BRAIN_IMPORT_ROOTS:-/opt/data/workspace:/opt/data/outputs:/app/data/brain-imports}
      # Same durable volume as Hermes, mounted read-only below. Warehouse
      # projects only SKILL.md frontmatter into capability_search; bodies stay
      # canonical in Hermes and load on demand with skill_view.
      WAREHOUSE_HERMES_SKILLS_ROOT: /opt/data/skills
      CALLIOPE_MEMORY_INFERENCE_BASE_URL: ${RVBBIT_CLOVER_OPENAI_BASE_URL:-http://clover:8090/v1}
      # Who writes chat memories: calliope (quoted claims, memory_claims.py) or hindsight.
      CALLIOPE_MEMORY_EXTRACTOR: ${CALLIOPE_MEMORY_EXTRACTOR:-calliope}
      CALLIOPE_MEMORY_SCOPE: ${CALLIOPE_MEMORY_SCOPE:-shared}
      CALLIOPE_HINDSIGHT_METADATA_ONLY: "true"
      RVBBIT_GATEWAY_TOKEN: ${RVBBIT_GATEWAY_TOKEN:?Provision RVBBIT_GATEWAY_TOKEN in /opt/rvbbit/.env}
      RVBBIT_MIRROR_TOKEN: ${RVBBIT_MIRROR_TOKEN:?Provision RVBBIT_MIRROR_TOKEN in /opt/rvbbit/.env}
    volumes: !override
      - rvbbit_warehouse_mcp:/app/data
      - rvbbit_hermes:/opt/data:ro
      - rvbbit_desktop:/var/lib/calliope-desktop:ro

  origin:
    extends:
      file: docker-compose.uber.yml
      service: origin
    profiles: !reset []
    image: ${CALLIOPE_ORIGIN_IMAGE:-caddy:2-alpine}
    container_name: calliope-origin
    depends_on: !override
      datarabbit:
        condition: service_started
      calliope:
        condition: service_healthy
    environment:
      # CALLIOPE_PUBLIC_HOST (e.g. calliope.example.com) makes Caddy the TLS
      # terminator for the customer door: automatic ACME certificates, https
      # on :443, and http on :80 reduced to the ACME challenge plus a redirect.
      # Blank keeps the plain :80 listener for tunnelled or externally
      # terminated deployments. WAREHOUSE_PUBLIC_URL and LENS_PUBLIC_URL must
      # then be https://<CALLIOPE_PUBLIC_HOST> so cookies, the OAuth issuer,
      # and embedded artifact URLs agree with the served origin.
      ORIGIN_LISTEN: ${CALLIOPE_PUBLIC_HOST:-:80}
      CALLIOPE_ACME_EMAIL: ${CALLIOPE_ACME_EMAIL:-}
      CALLIOPE_TRUSTED_PROXIES: ${CALLIOPE_TRUSTED_PROXIES:-127.0.0.1/32}
      CALLIOPE_ROOT_REDIRECT: ${CALLIOPE_ROOT_REDIRECT:-/floor}
      CALLIOPE_DEMO_MODE: ${CALLIOPE_DEMO_MODE:-0}
      BURROW_LISTEN: ":81"
      DATARABBIT_PUBLIC_URL: ${LENS_PUBLIC_URL:-http://localhost:3001}
      WAREHOUSE_PUBLIC_URL: ${WAREHOUSE_PUBLIC_URL:-http://localhost:8080}
      LENS_UPSTREAM: datarabbit:3000
      WAREHOUSE_UPSTREAM: calliope:8765
    volumes: !override
      - ./origin/Caddyfile.calliope:/etc/caddy/Caddyfile:ro
      # ACME account keys and issued certificates survive container recreation.
      - rvbbit_origin_data:/data
      - rvbbit_origin_config:/config
    # Customer traffic lands on the Gallery listener. The separate loopback
    # listener keeps DataRabbit at / without forcing Next.js under a subpath.
    # Both ports use the same host-scoped Warehouse session cookie. With
    # CALLIOPE_PUBLIC_HOST set, publish RVBBIT_ORIGIN_PORT=80 and
    # RVBBIT_ORIGIN_TLS_PORT=443 and open both to the internet; the TLS port
    # is otherwise an idle loopback binding.
    ports: !override
      - "${RVBBIT_ORIGIN_PORT:-8080}:80"
      - "${RVBBIT_ORIGIN_TLS_PORT:-127.0.0.1:8443}:443"
      - "${RVBBIT_BURROW_PORT:-127.0.0.1:3001}:81"

networks:
  default:
    name: ${CALLIOPE_DOCKER_NETWORK:-calliope}

volumes:
  rvbbit_staging:
    name: ${CALLIOPE_STAGING_VOLUME:-calliope_staging}
  rvbbit_pgdata:
    name: ${CALLIOPE_PGDATA_VOLUME:-calliope_pgdata}
  rvbbit_duck_run:
    name: ${CALLIOPE_DUCK_RUN_VOLUME:-calliope_duck_run}
  rvbbit_duck_arrow_ipc:
    name: ${CALLIOPE_DUCK_ARROW_IPC_VOLUME:-calliope_duck_arrow_ipc}
  rvbbit_lens:
    name: ${CALLIOPE_DATARABBIT_VOLUME:-calliope_datarabbit}
  rvbbit_warren:
    name: ${CALLIOPE_WARREN_VOLUME:-calliope_warren}
  rvbbit_warehouse_mcp:
    name: ${CALLIOPE_SERVER_VOLUME:-calliope_server}
  rvbbit_hermes:
    name: ${CALLIOPE_HERMES_VOLUME:-calliope_hermes}
  rvbbit_desktop:
    name: ${CALLIOPE_DESKTOP_VOLUME:-calliope_desktop}
  rvbbit_desktop_home:
    name: ${CALLIOPE_DESKTOP_HOME_VOLUME:-calliope_desktop_home}
  rvbbit_origin_data:
    name: ${CALLIOPE_ORIGIN_DATA_VOLUME:-calliope_origin_data}
  rvbbit_origin_config:
    name: ${CALLIOPE_ORIGIN_CONFIG_VOLUME:-calliope_origin_config}
