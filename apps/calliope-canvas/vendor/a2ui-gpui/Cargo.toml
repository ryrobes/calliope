[package]
name = "a2ui-gpui"
version = "0.3.1"
edition = "2024"
license = "MIT"
[features]
default = ["backend"]
backend = []
# Mobile compatibility with GPUI Kit 0.7, while desktop stays on 0.5.
gpui-next = []
[dependencies]
gpui = "=0.2.2"
gpui-component = "=0.5.1"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
a2ui-base = { git = "https://github.com/liangdi/a2ui.git", rev = "97391988e41052240c36c27442912420903f13a8" }
a2ui-image = { git = "https://github.com/liangdi/a2ui.git", rev = "97391988e41052240c36c27442912420903f13a8" }
chrono = { version = "0.4", default-features = false, features = ["std"] }
